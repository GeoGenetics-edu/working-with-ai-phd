<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Language Model Lab</title>
<meta name="theme-color" content="#F6F7F6">
<style>
:root{--bg:#F6F7F6;--ink:#16202A;--mut:#5B6670;--rule:#DCE0E2;--ult:#2B44C2;--pale:#E8ECFA;--red:#A3262A;--sage:#9AA5AB;
--sans:"Helvetica Neue",Helvetica,Arial,sans-serif;--serif:Georgia,"Times New Roman",serif;--mono:"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--sans)}
a{color:var(--ult)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ult);outline-offset:2px}
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;overflow:auto;padding:32px 24px 28px 32px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:18px}
.mark{font-weight:600;font-size:17px;color:var(--ink);text-decoration:none}
.part{display:flex;flex-direction:column;gap:2px}
.num{font-weight:300;font-size:26px;line-height:1;color:#B4BDC2}
.part.here .num{color:var(--ult)}
.part.opt{margin-top:4px;padding-top:12px;border-top:1px solid var(--rule)}
.part.opt .step{color:var(--mut)}
.part.opt .step.on{color:var(--ult)}
.pq{font-size:13px;color:var(--mut);margin:3px 0 4px}
.step{display:block;color:var(--ink);text-decoration:none;font-size:15px;padding:3px 0 3px 12px;border-left:2px solid transparent}
.step:hover{color:var(--ult)}
.step.on{border-left-color:var(--ult);color:var(--ult);font-weight:600}
.step.top{padding-left:0;border:0}
.rail-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:6px;font-size:13px}
.rail-foot a{color:var(--mut)}
main{padding:56px clamp(24px,7vw,110px) 64px}
.page{max-width:820px}
h1:focus{outline:none}
h1{font-weight:600;font-size:clamp(34px,4vw,48px);line-height:1.08;letter-spacing:-.025em;margin:0 0 22px}
.lede{font:21px/1.6 var(--serif);margin:0 0 34px;padding-left:20px;border-left:2px solid var(--ult);max-width:62ch}
.task{font-size:16px;color:var(--mut);margin:0 0 14px}
.box{border-top:1px solid var(--ink);padding-top:22px}
.take{margin-top:44px;padding-top:20px;border-top:1px solid var(--ink)}
.take p{font:20px/1.55 var(--serif);margin:0 0 20px;max-width:60ch}
.nav{display:flex;gap:12px;flex-wrap:wrap}
.btn{background:var(--ult);color:#fff;border:0;border-radius:4px;padding:10px 16px;font-weight:600;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--ult);border:1px solid var(--ult)}
.btn.quiet{background:transparent;color:var(--ink);border:1px solid #B4BDC2;font-weight:400}
.btn:disabled{opacity:.45;cursor:default}
.note{font-size:14px;color:var(--mut);margin-top:12px}
/* overview */
.ex{border-top:1px solid var(--ink);margin:0 0 40px}
.ex div{display:grid;grid-template-columns:130px 1fr;gap:18px;padding:14px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.ex b{font-weight:400;font-size:13px;color:var(--mut)}
.ex span{font:22px/1.4 var(--serif)}
.ex .wrong{color:var(--red)}
.plist{list-style:none;padding:0;margin:0 0 36px;border-top:1px solid var(--rule)}
.plist li{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--rule)}
.plist strong{display:block;font-size:19px}
.plist span{color:var(--mut);font-size:15px}
/* tokens */
input[type=text]{font:20px var(--sans);width:100%;max-width:560px;padding:10px 12px;border:1px solid #B4BDC2;border-radius:4px;background:#fff;color:var(--ink)}
.toks{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.tk{display:flex;flex-direction:column;align-items:center;gap:6px}
.tk i{font-style:normal;font:22px var(--mono);padding:8px 11px;border:1.5px solid var(--ult);color:var(--ult);border-radius:3px;white-space:pre}
.tk small{font:13px var(--mono);color:var(--mut)}
.count{margin-top:14px;font-size:15px;color:var(--mut)}
/* sentences */
.sents{list-style:none;padding:0;margin:0}
.sents li{margin:0 0 8px}
.sents button{width:100%;text-align:left;background:transparent;border:1px solid var(--rule);border-radius:4px;padding:10px 14px;font:19px/1.4 var(--serif);color:var(--ink)}
.sents button:hover{border-color:var(--ult)}
.sents button.done{background:var(--pale);border-color:var(--ult)}
.sents em{font-style:normal;color:var(--ult)}
.bars{margin-top:22px;display:grid;gap:10px;max-width:560px}
.bar{display:grid;grid-template-columns:110px 1fr 64px;gap:12px;align-items:center;font-size:16px}
.bar .tr{display:block;height:16px;background:var(--rule)}
.bar .fill{display:block;height:100%;background:var(--ult);width:0;transition:width .35s}
.bar.th .fill{background:var(--sage)}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
/* replies */
.reply{font:24px/1.4 var(--serif);margin:20px 0 6px;min-height:34px}
.runs{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.run{font:15px var(--sans);padding:6px 10px;border:1px solid var(--ult);border-radius:3px}
.run.t{border-color:var(--sage)}
.weights{display:flex;gap:28px;margin:18px 0 4px;font:15px var(--mono);color:var(--mut)}
.weights b{color:var(--ink);font-weight:600}
/* window */
.window{border:1px solid var(--ink);border-radius:4px;padding:14px 16px;margin:16px 0;background:#fff}
.window h3{margin:0 0 8px;font-size:13px;font-weight:400;color:var(--mut)}
.wline{font:17px/1.45 var(--serif);padding:8px 10px;margin:0 0 6px;background:#F0F2F3;border-radius:3px}
.wline.doc{background:var(--pale)}
.wline small{display:block;font:12px var(--sans);color:var(--mut);margin-bottom:2px}
.wline code{font:15px var(--mono)}
.toggle{display:flex;gap:10px;align-items:center;font-size:16px;margin:0 0 6px}
.toggle input{width:18px;height:18px;accent-color:var(--ult)}
.who{display:flex;gap:10px;margin:6px 0 12px}
.who span{font-size:14px;padding:5px 10px;border:1px solid var(--rule);border-radius:3px;color:var(--mut)}
.who span.act{border-color:var(--ult);color:var(--ult);font-weight:600}
/* evaluation */
table{border-collapse:collapse;width:100%;max-width:600px;font-size:17px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--rule)}
th{font-weight:400;font-size:13px;color:var(--mut)}
td.pass{color:var(--ult);font-weight:600}td.fail{color:var(--red)}
.seg{display:flex;gap:8px;margin:12px 0 18px}
.seg button{background:transparent;border:1px solid #B4BDC2;border-radius:4px;padding:8px 14px;color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--pale);border-color:var(--ult);font-weight:600}
.result{font:22px var(--serif);margin-top:16px}
.qs{counter-reset:q;list-style:none;padding:0;margin:0}
.qs li{font:22px/1.45 var(--serif);padding:16px 0;border-bottom:1px solid var(--rule)}

.stepno{font-size:14px;color:var(--mut);margin:0 0 8px}
.alabel{display:block;margin:18px 0 6px;font-size:16px}
input[type=range]{width:100%;max-width:560px;accent-color:var(--ult)}
#actx button{font-family:var(--serif);font-size:17px}
h3.sub{font-size:14px;font-weight:600;margin:26px 0 8px}
tr.top td{background:#fff}
.pick{font-size:12px;color:#fff;background:var(--ult);padding:2px 6px;border-radius:3px;margin-left:6px;vertical-align:2px}
.dx{font:16px/1.45 var(--serif);color:var(--ink);margin-top:4px}
mark{background:var(--pale);color:var(--ult);padding:0 2px}
#rq button{font-family:var(--serif);font-size:17px}
pre.code{font:15px/1.55 var(--mono);background:#fff;border:1px solid var(--rule);border-radius:4px;padding:12px 14px;overflow:auto;margin:0 0 14px}
pre.code .bad{background:#F6E3E3}
.aln{font:22px/1.5 var(--mono);letter-spacing:.18em}
.aln .col{color:var(--ult);font-weight:600}
.aln .q{border:1.5px dashed var(--sage);padding:0 2px}
.predict{border:1px solid var(--ult);border-radius:4px;padding:16px 18px;margin:0 0 26px;background:#fff}
.predict h2{font-size:13px;font-weight:600;color:var(--ult);margin:0 0 6px}
.predict p{font:20px/1.45 var(--serif);margin:0 0 12px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{background:transparent;border:1px solid #B4BDC2;border-radius:4px;padding:8px 14px;color:var(--ink);font-size:16px}
.opts button:hover:not(:disabled){border-color:var(--ult)}
.opts button[aria-pressed=true]{background:var(--pale);border-color:var(--ult);font-weight:600}
.opts button:disabled{cursor:default}
.act[inert]{display:none}
.locked{font-size:14px;color:var(--mut);margin:-14px 0 18px}
.fb{display:none;margin:0 0 18px;padding:14px 16px;border-left:3px solid var(--ult);background:#fff;font-size:17px;line-height:1.5}
.fb.show{display:block}
.fb b{display:block;margin-bottom:4px}
.fb.miss{border-left-color:var(--sage)}
.take .tk-text{display:none}
.take .tk-text.show{display:block}
.work{margin:0 0 22px;padding:12px 0 0;border-top:1px solid var(--rule)}
.work h3{font-size:13px;font-weight:600;color:var(--mut);margin:0 0 4px}
.work p{font:18px/1.5 var(--serif);margin:0}
.simple{font-size:15px;line-height:1.5;color:var(--mut);border-left:2px solid var(--rule);padding-left:12px;margin-top:18px;max-width:64ch}
.check{list-style:none;padding:0;margin:0 0 40px}
.check li{padding:16px 0;border-bottom:1px solid var(--rule)}
.check p{font:20px/1.45 var(--serif);margin:0 0 10px}
.check .ans{font-size:15px;color:var(--mut);margin-top:10px;display:none}
.check .ans.show{display:block}
@media (max-width:860px){
 .shell{grid-template-columns:1fr}
 .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--rule);padding:16px 20px;gap:10px}
 .rail nav{display:flex;flex-wrap:wrap;gap:4px 14px}
 .part{display:contents}.num,.pq{display:none}
 .step{padding:2px 0;border:0}.step.on{border-bottom:2px solid var(--ult)}
 .rail-foot{flex-direction:row;flex-wrap:wrap;gap:6px 14px;margin-top:0}
 main{padding:28px 20px 48px}
 table{display:block;overflow-x:auto}
 .aln{font-size:18px;letter-spacing:.1em}
 .ex div{grid-template-columns:1fr;gap:2px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.train{margin:0 0 22px}.train .task{margin-bottom:10px}.box.act[inert]~*{} .train .sents button{cursor:default}body:has(.box.act:not([inert])) .train .sents button{cursor:pointer}</style>
<script src="tokenizer.js" defer></script>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <a class="mark" href="#home">Language Model Lab</a>
    <nav id="nav" aria-label="Steps"></nav>
    <div class="rail-foot">
      <a href="slides.html">Opening slides</a>
      
    </div>
  </aside>
  <main><div class="page" id="view"></div></main>
</div>
<script>
const PARTS=[
 ['01','Inside the model',[['tokens','Tokens'],['prediction','Prediction'],['attention','Attention'],['sampling','Sampling'],['training','Training'],['beyond','Beyond text']]],
 ['02','Around the model',[['retrieval','Retrieval'],['agents','Agents'],['permissions','Permissions'],['code','Checking the code']]],
 ['03','Checking the output',[['evaluation','Evaluation']]],
];
const OPT=['training','permissions','code'];
const CORE=PARTS.map(([n,q,items])=>[n,q,items.filter(i=>!OPT.includes(i[0]))]);
const ORDER=['home',...CORE.flatMap(p=>p[2].map(s=>s[0])),'discussion'];
const NAME=Object.fromEntries([['home','Overview'],...PARTS.flatMap(p=>p[2]),['discussion','Before the discussion']]);
const $=s=>document.querySelector(s);
const SENTS=[['You can submit on ','Friday',' before noon.'],['Late work: submit on ','Friday',' with a note to the teacher.'],['Drafts: submit on ','Thursday',' for comments.'],['Final reports: submit on ','Friday',' at 12:00.'],['Submit on ','Thursday',' if you want feedback.']];
const NOTICE='Submissions close Thursday at 17:00. Friday is for feedback.';

function nav(cur){
  const item=(id,label,cls='')=>`<a class="step ${cls}${id===cur?' on':''}" href="#${id}"${id===cur?' aria-current="page"':''}>${label}</a>`;
  $('#nav').innerHTML=item('home','Overview','top')+CORE.map(([n,q,items])=>`<div class="part${items.some(i=>i[0]===cur)?' here':''}"><span class="num">${n}</span><span class="pq">${q}</span>${items.map(i=>item(i[0],i[1])).join('')}</div>`).join('')+item('discussion','Before the discussion','top')+`<div class="part opt${OPT.includes(cur)?' here':''}"><span class="pq">If you have time</span>${OPT.map(id=>item(id,NAME[id])).join('')}</div>`;
}
function page(id,title,lede,body,take){
  const o=OPT.indexOf(id),k=ORDER.indexOf(id),prev=o>=0?(OPT[o-1]||'discussion'):ORDER[k-1],next=o>=0?OPT[o+1]:ORDER[k+1],P=PRED[id];
  const pred=P?`<div class="predict"><h2>Predict first</h2><p>${P.q}</p><div class="opts" id="popts">${P.opts.map((o,i)=>`<button data-i="${i}" aria-pressed="false">${o}</button>`).join('')}</div></div><p class="locked" id="locked">Pick an answer to unlock the exercise.</p>`:'';
  const steps=CORE.flatMap(p=>p[2].map(x=>x[0])),si=steps.indexOf(id);
  return `${si>=0?`<p class="stepno">Step ${si+1} of ${steps.length}</p>`:o>=0?'<p class="stepno">Optional</p>':''}<h1>${title}</h1>${lede?`<p class="lede">${lede}</p>`:''}${PRE[id]?PRE[id]():''}${pred}<div class="box act"${P?' inert':''}>${body}</div>
  <div class="take"><div class="fb" id="fb" aria-live="polite"></div>${take?`<p class="tk-text${P?'':' show'}" id="tk">${take}</p>`:''}<div class="nav">${prev?`<a class="btn ghost" href="#${prev}">Back</a>`:''}${next?`<a class="btn" href="#${next}">Next: ${NAME[next]}</a>`:''}</div></div>`;
}
let guess=null,finished=false;
function initPredict(id){guess=null;finished=false;const P=PRED[id];if(!P)return;document.querySelectorAll('#popts button').forEach(b=>b.onclick=()=>{if(finished)return;guess=+b.dataset.i;document.querySelectorAll('#popts button').forEach(x=>x.setAttribute('aria-pressed',x===b));document.querySelector('.act').removeAttribute('inert');const l=$('#locked');if(l)l.remove()})}
function done(id,detail){if(finished||guess===null)return;finished=true;const P=PRED[id];const ok=guess===P.ans;const fb=$('#fb');fb.className='fb show'+(ok?'':' miss');fb.innerHTML=`<b>${ok?'Your prediction held.':'Not what you predicted.'}</b>You picked “${P.opts[guess]}”. ${detail}`;document.querySelectorAll('#popts button').forEach(b=>b.disabled=true);$('#tk')?.classList.add('show')}
const PRED={
 beyond:{q:'A new protein fragment has one unknown residue. Counting the same position in five related sequences gives the most common residue. Will that be the residue in this fragment?',opts:['Yes, the most common one is right','Not necessarily'],ans:1},
 permissions:{q:'An agent’s model asks to delete a data folder. What decides whether that happens?',opts:['The model’s own judgement','The rules in the program around it','Nothing can stop it'],ans:1},
 code:{q:'The agent’s script runs without errors and prints a number. Is the number right?',opts:['Yes, it ran without errors','Not necessarily'],ans:1},
 attention:{q:'“Drafts for comments: submit on …” and “Final reports: submit on …” end with the same two words. Will the model predict the same day for both?',opts:['Yes, only the last words count','No, earlier words can change it'],ans:1},
 tokens:{q:'“When do submissions close?” has four words. How many tokens will it become?',opts:['Fewer than four','Exactly four, one per word','More than four'],ans:2},
 prediction:{q:'In the five training sentences, which word will follow “submit on” most often?',opts:['Friday','Thursday','Both equally'],ans:0},
 sampling:{q:'If you ask the same question 10 times, how many times will it say Friday?',opts:['10 of 10, the most likely answer','About 6, but it varies','Exactly 6'],ans:1},
 training:{q:'After many rounds of training on the five sentences, where will the model end up?',opts:['Friday 100%','Friday about 60%','Stays at 50/50'],ans:1},
 retrieval:{q:'The search looks for documents that share words with your question. Will it always put the course notice in the window?',opts:['Yes, the notice is the obvious match','No, it can pick the wrong document or nothing'],ans:1},
 agents:{q:'When an agent “reads a file”, who actually opens it?',opts:['The model','The program around the model','Nobody, the model already knows'],ans:1},
 evaluation:{q:'Deadline right in 3 of 4 tries, rule right in 1 of 4. Does the assistant work?',opts:['Yes','No','It depends on the bar you set'],ans:2},
};

const bars=(f,t)=>`<div class="bars"><div class="bar"><span>Friday</span><span class="tr"><span class="fill" style="width:${f*100}%"></span></span><b>${Math.round(f*100)}%</b></div><div class="bar th"><span>Thursday</span><span class="tr"><span class="fill" style="width:${t*100}%"></span></span><b>${Math.round(t*100)}%</b></div></div>`;

const V={};
V.home=()=>`<h1>Language Model Lab</h1>
<p class="lede">This lab shows how a language model produces a reply and what is built around it, using one example: a course assistant that gives the wrong submission deadline. There are ${CORE.flatMap(p=>p[2]).length} steps.</p>
<div class="ex"><div><b>Student</b><span>When do submissions close?</span></div><div><b>Assistant</b><span class="wrong">You can submit on Friday.</span></div><div><b>Course notice</b><span>${NOTICE}</span></div></div>
<ol class="plist">${CORE.map(([n,q,items])=>`<li><span class="num">${n}</span><div><strong>${q}</strong><span>${items.map(i=>i[1]).join(', ')}</span></div></li>`).join('')}</ol>
<p class="note" style="margin:-20px 0 28px">If you have time afterwards: ${OPT.map(id=>NAME[id]).join(', ')}.</p>
<div class="nav"><a class="btn" href="#tokens">Next: Tokens</a></div>`;

/* 1 tokens */
const VOCAB=['when','do','does','close','the','a','to','is','on','at','of','in','and','what','submit','for','friday','thursday','course','?','.',','];
function tokenize(text){
  const out=[];(text.match(/[A-Za-zÀ-ÿ]+|\d+|[^\sA-Za-zÀ-ÿ\d]/g)||[]).forEach((w,i)=>{
    const lead=/[A-Za-zÀ-ÿ\d]/.test(w)&&i>0?'␣':'';
    if(VOCAB.includes(w.toLowerCase())||w.length<=4){out.push(lead+w);return}
    let rest=w,first=true;while(rest.length){const n=rest.length>8?4:rest.length>5?3:rest.length;out.push((first?lead:'')+rest.slice(0,n));rest=rest.slice(n);first=false}
  });return out;
}
const tid=t=>{let h=7;for(const c of t)h=(h*31+c.charCodeAt(0))%50000;return h+100};
V.tokens=()=>page('tokens','Tokens','A model does not read words. Text is cut into tokens, and each token becomes a number.',
 `<p class="task">Try a species, a gene or your own name.</p>
 <input type="text" id="tin" value="When do submissions close?" aria-label="Text to split into tokens">
 <div class="toks" id="tout"></div><p class="count" id="tcount"></p><p class="note" id="tsrc"></p>`,
 'Common words are one token; rare words split into pieces. The model sees numbers, not letters.');
function splitTokens(text){if(window.realTokenize)return window.realTokenize(text).map(([t,id])=>[t.replace(/ /g,'␣'),id]);return tokenize(text).map(t=>[t,tid(t)])}
function initTokens(){
 const run=()=>{const text=$('#tin').value;const t=splitTokens(text);const words=(text.match(/\S+/g)||[]).length;
  $('#tout').innerHTML=t.map(([x,id])=>`<span class="tk"><i>${x.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</i><small>${id}</small></span>`).join('');
  $('#tcount').textContent=`${words} ${words===1?'word':'words'} became ${t.length} ${t.length===1?'token':'tokens'}.`;
  $('#tsrc').textContent=window.realTokenize?'GPT-4 tokenizer (cl100k_base). ␣ is a space; the number is the token ID.':'Illustrative tokenizer while the real one loads.'};
 $('#tin').oninput=run;run();addEventListener('tokenizer-ready',run,{once:true});
 document.querySelectorAll('#popts button').forEach(b=>b.addEventListener('click',()=>{const n=splitTokens('When do submissions close?').length;done('tokens',`${n} tokens: the question mark is its own token. Now try a species name.`)}));
}
/* 2 prediction */
const PRE={prediction:()=>`<div class="train"><p class="task">The training text: five course notices.</p><ol class="sents" id="sents">${SENTS.map((s,i)=>`<li><button data-i="${i}">${s[0]}<em>${s[1]}</em>${s[2]}</button></li>`).join('')}</ol></div>`};
V.prediction=()=>page('prediction','Prediction','A model gives each possible next token a probability. The simplest way is to count what came next in the training text.',
 `<p class="task">Click each sentence above to count the word after “submit on”.</p>
 <div id="pbars">${bars(0,0)}</div><p class="count" id="pcount">0 of 5 sentences counted.</p>`,
 'Friday 60%, Thursday 40%. That describes the training text, not your course.');
function initPrediction(){const done=new Set();document.querySelectorAll('#sents button').forEach(b=>b.onclick=()=>{if(document.querySelector('.box.act[inert]'))return;done.add(+b.dataset.i);b.classList.add('done');const f=[...done].filter(i=>SENTS[i][1]==='Friday').length,t=done.size-f;$('#pbars').innerHTML=bars(f/5,t/5);$('#pcount').textContent=`${done.size} of 5 sentences counted: Friday ${f}, Thursday ${t}.`;if(done.size===5)window.done('prediction','Friday 3, Thursday 2: the counts favour Friday.')})}


/* attention */
const CTX={comments:{words:['Drafts','for','comments:','submit','on'],key:2,f:.1,label:'Drafts for comments: submit on …'},reports:{words:['Final','reports:','submit','on'],key:1,f:.9,label:'Final reports: submit on …'}};
V.attention=()=>page('attention','Attention','Counting only uses the last words. Attention lets the model weigh earlier words too.',
 `<p class="task">Pick a sentence and move the slider.</p>
 <div class="seg" id="actx"><button data-c="comments" aria-pressed="true">${CTX.comments.label}</button><button data-c="reports" aria-pressed="false">${CTX.reports.label}</button></div>
 <div class="toks" id="awords"></div>
 <label class="alabel" for="aslide">Attention to <b id="aword"></b>: <b id="aval"></b></label>
 <input type="range" id="aslide" min="0" max="100" value="0" aria-describedby="aval">
 <div id="abars"></div><p class="count" id="anote2"></p>
 <p class="simple">Simplified: one weight, set by hand. Real models learn many.</p>`,
 'The same last words give different predictions in different contexts. Nothing in the weights checks the facts.');
function initAttention(){let c='comments';const seen={comments:0,reports:0};
 const show=()=>{const C=CTX[c],a=+$('#aslide').value/100;const pf=(1-a)*.6+a*C.f;
  $('#awords').innerHTML=C.words.map((w,i)=>`<span class="tk"><i style="${i===C.key?`background:rgba(43,68,194,${a*.9});color:${a>.45?'#fff':'var(--ult)'}`:''}">${w}</i><small>${i===C.key?Math.round(a*100)+'%':''}</small></span>`).join('')+'<span class="tk"><i style="border-style:dashed;color:var(--mut);border-color:var(--sage)">?</i><small>next</small></span>';
  $('#aword').textContent=C.words[C.key].replace(/:$/,'');$('#aval').textContent=Math.round(a*100)+'%';$('#abars').innerHTML=bars(pf,1-pf);
  $('#anote2').textContent=a===0?'With no attention to earlier words, this is the counting model: Friday 60%.':`“${C.words[C.key].replace(/:$/,'')}” pulls the prediction towards ${C.f>.5?'Friday':'Thursday'}.`;
  if(a>=.5)seen[c]=1;if(seen.comments&&seen.reports)done('attention','“comments” moved it towards Thursday, “reports” towards Friday.')};
 document.querySelectorAll('#actx button').forEach(b=>b.onclick=()=>{c=b.dataset.c;document.querySelectorAll('#actx button').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#aslide').value=0;show()});
 $('#aslide').oninput=show;show()}

/* 3 sampling */
V.sampling=()=>page('sampling','Sampling','A chatbot draws the next word at random, weighted by the probabilities: Friday 60%, Thursday 40%.',
 `<p class="task">Ask 10 times. Then turn on “Always pick the most likely word” and ask again.</p>
 <div class="nav"><button class="btn" id="ask">Ask “When do submissions close?”</button><button class="btn quiet" id="sreset">Start over</button></div><label class="toggle" style="margin-top:14px"><input type="checkbox" id="greedy" disabled> Always pick the most likely word</label>
 <p class="reply" id="sreply" aria-live="polite"></p><div class="runs" id="sruns"></div><p class="count" id="stally"></p>`,
 'The same question gives different answers. One reply does not tell you how often each answer comes up.');
function initSampling(){let runs=[];const draw=()=>{const d=$('#greedy').checked||Math.random()<.6?'Friday':'Thursday';runs.push(d);$('#sreply').textContent=`“You can submit on ${d}.”`;$('#sruns').innerHTML=runs.map((r,i)=>`<span class="run${r==='Thursday'?' t':''}">${i+1}. ${r}</span>`).join('');const f=runs.filter(r=>r==='Friday').length;$('#stally').textContent=`Friday ${f}, Thursday ${runs.length-f}.`;if(runs.length>=10)$('#greedy').disabled=false;if(runs.length===10)done('sampling',`You got Friday ${f} ${f===1?'time':'times'} in 10. About 6 is expected; it changes each time.`);else if(runs.length<10)$('#stally').textContent+=` Ask ${10-runs.length} more.`};$('#ask').onclick=draw;$('#sreset').onclick=()=>{runs=[];$('#greedy').checked=false;$('#greedy').disabled=!finished;$('#sreply').textContent='';$('#sruns').innerHTML='';$('#stally').textContent=''}}

/* 4 training */
V.training=()=>page('training','Training','Real models store weights, not counts. Training adjusts the weights after each sentence.',
 `<p class="task">The model starts at 50/50. Train it on the five sentences.</p>
 <div class="nav"><button class="btn" id="train1">Train on the next sentence</button><button class="btn quiet" id="train10">Train 20 more</button><button class="btn quiet" id="treset">Start over</button></div>
 <p class="note" id="tsent">&nbsp;</p><div id="tbars">${bars(.5,.5)}</div>
 <div class="weights" id="tw"></div><p class="count" id="tsteps">0 sentences seen.</p><p class="simple">Simplified: two weights. Real models have billions and generalise to new sentences, sometimes wrongly.</p>`,
 'The model ends near the counts, 60/40. What it keeps is numbers, not facts.');
function initTraining(){let wf=0,wt=0,step=0;const show=s=>{const ef=Math.exp(wf),et=Math.exp(wt),pf=ef/(ef+et);$('#tbars').innerHTML=bars(pf,1-pf);$('#tw').innerHTML=`<span>weight for Friday <b>${wf.toFixed(2)}</b></span><span>weight for Thursday <b>${wt.toFixed(2)}</b></span>`;$('#tsteps').textContent=`${step} sentences seen.`;if(step>=20)done('training',`After ${step} sentences the model says Friday ${Math.round(pf*100)}%, close to the 60% in the training text.`);if(s)$('#tsent').innerHTML=`Sentence: ${s[0]}<em style="font-style:normal;color:var(--ult)">${s[1]}</em>${s[2]}`};
 const one=()=>{const s=SENTS[step%5];const ef=Math.exp(wf),et=Math.exp(wt),pf=ef/(ef+et);const y=s[1]==='Friday'?1:0;const lr=1.5/(step+3);wf+=lr*(y-pf);wt+=lr*((1-y)-(1-pf));step++;return s};
 $('#train1').onclick=()=>show(one());$('#train10').onclick=()=>{let s;for(let i=0;i<20;i++)s=one();show(s)};$('#treset').onclick=()=>{wf=wt=0;step=0;$('#tsent').innerHTML='&nbsp;';show()};show()}

/* 5 retrieval (RAG) */
const DOCS=[
 {t:'Course notice',x:NOTICE,good:true},
 {t:'Library opening times',x:'Opening times: the library closes at 17:00 on Fridays and at 20:00 on other weekdays.'},
 {t:'Seminar room',x:'The seminar room is booked on Friday mornings for the journal club.'},
 {t:'Exam rules',x:'Exam questions are submitted by the teacher two weeks before the exam.'},
];
const STOP=new Set('a an the is are do does did when what which who how to of on in at for and or it its by be you your i my we can will before after other'.split(' '));
const stem=w=>w.toLowerCase().replace(/[^a-zæøå0-9]/g,'').replace(/(ions|ion|ed|ing|s)$/,'');
const words=t=>(t.match(/[A-Za-zÆØÅæøå0-9]+/g)||[]).filter(w=>!STOP.has(w.toLowerCase())).map(stem).filter(Boolean);
function search(q){const qw=new Set(words(q));return DOCS.map(d=>{const hit=[...new Set(words(d.x))].filter(w=>qw.has(w));return {...d,score:hit.length,hit}}).sort((a,b)=>b.score-a.score)}
const mark=(text,hit)=>text.replace(/[A-Za-zÆØÅæøå0-9]+/g,w=>hit.includes(stem(w))&&!STOP.has(w.toLowerCase())?`<mark>${w}</mark>`:w);
V.retrieval=()=>page('retrieval','Retrieval (RAG)','RAG (retrieval-augmented generation): a search puts a matching document in the model’s window before it answers.',
 `<p class="task">Try all three questions.</p>
 <div class="seg" id="rq">${['When do submissions close?','What time does it close on Friday?','What is the deadline?'].map((q,i)=>`<button data-q="${q}" aria-pressed="${i===0}">${q}</button>`).join('')}</div>
 <h3 class="sub">1. Search: documents ranked by shared words</h3>
 <table><thead><tr><th>Document</th><th>Shared words</th><th>Score</th></tr></thead><tbody id="rrank"></tbody></table>
 <h3 class="sub">2. Window: what the model sees</h3>
 <div class="window"><div id="rwin"></div></div>
 <h3 class="sub">3. Generate</h3>
 <div class="nav"><button class="btn" id="rgen">Generate a reply</button></div>
 <p class="reply" id="rreply" aria-live="polite"></p><p class="count" id="rexplain"></p>
 <p class="simple">Simplified: word matching and fixed probabilities. Real assistants match by meaning and still pick wrong passages.</p>`,
 'The search decides what the model sees. A wrong or missing document still gives a confident reply.');
function initRetrieval(){let q='When do submissions close?';const asked=new Set();
 const show=()=>{const r=search(q);const top=r[0].score>0?r[0]:null;
  $('#rrank').innerHTML=r.map((d,i)=>`<tr${i===0&&top?' class="top"':''}><td>${d.t}${i===0&&top?' <span class="pick">in window</span>':''}<div class="dx">${mark(d.x,d.hit)}</div></td><td>${d.hit.join(', ')||'none'}</td><td>${d.score}</td></tr>`).join('');
  $('#rwin').innerHTML=(top?`<div class="wline doc"><small>${top.t}, found by the search</small>${top.x}</div>`:'<div class="wline doc"><small>Search</small>No document shared any words with the question. Nothing was added.</div>')+`<div class="wline"><small>Your question</small>${q}</div>`;
  $('#rreply').textContent='';$('#rexplain').textContent='';return top};
 $('#rgen').onclick=()=>{const top=search(q)[0];let reply,why;
  if(top.score===0){const d=Math.random()<.6?'Friday':'Thursday';reply=`“The deadline is ${d}.”`;why='Nothing from your documents was in the window, so the reply comes from the training text alone: Friday 60%, Thursday 40%.'}
  else if(top.good){const d=Math.random()<.15?'Friday':'Thursday';reply=d==='Thursday'?'“Submissions close Thursday at 17:00.”':'“You can submit on Friday.”';why=d==='Thursday'?'Taken from the course notice in the window.':'The right passage was in the window, but it also mentions Friday, and Friday was drawn this time.'}
  else{reply='“It closes at 17:00 on Friday.”';why=`The search picked “${top.t}”, which shares the words ${top.hit.map(w=>'“'+w+'”').join(', ')} with your question. If you meant the submission deadline, this fluent reply is about the wrong thing.`}
  $('#rreply').textContent=reply;$('#rexplain').textContent=why+(asked.has(q)||asked.size>=2?'':` Try the other questions.`);asked.add(q);
  if(asked.size>=3)done('retrieval','The wording of the question decided which document reached the window.')};
 document.querySelectorAll('#rq button').forEach(b=>b.onclick=()=>{q=b.dataset.q;document.querySelectorAll('#rq button').forEach(x=>x.setAttribute('aria-pressed',x===b));show()});show()}

/* 6 agents */
const LOOP=[
 ['You','Which column of assistant_trials.csv says how many replies were correct?',''],
 ['Model','Asks for a tool: <code>read_first_line("assistant_trials.csv")</code>','The model cannot open files. It only writes a request.'],
 ['Program','Runs the tool and adds the result: <code>task,correct_replies,trials</code>','The program around the model does the reading.'],
 ['Model','Answers: “The column is correct_replies.”','The model wrote its answer from what the tool returned.'],
];
V.agents=()=>page('agents','Agents','An agent is a program that runs a loop around the model: the model asks for a tool, the program runs it, and the result goes back to the model.',
 `<p class="task">Step through one loop.</p>
 <div class="who" id="awho"><span>You</span><span>Model</span><span>Program</span></div>
 <div class="window"><h3>What the model sees</h3><div id="awin"></div></div>
 <p class="note" id="anote">&nbsp;</p>
 <div class="nav"><button class="btn" id="anext">Next step</button><button class="btn quiet" id="areset">Start over</button></div>`,
 'The model only writes text. The program around it opens files and runs code.');
function initAgents(){let k=0;const show=()=>{$('#awin').innerHTML=LOOP.slice(0,k).map(([w,t])=>`<div class="wline${w==='Program'?' doc':''}"><small>${w}</small>${t}</div>`).join('')||'<p class="note">Empty.</p>';document.querySelectorAll('#awho span').forEach(s=>s.classList.toggle('act',k>0&&s.textContent===LOOP[k-1][0]));$('#anote').textContent=k?LOOP[k-1][2]||' ':' ';$('#anext').disabled=k>=LOOP.length;if(k>=3)done('agents','The program opened the file. The model only wrote the request and the answer.')};$('#anext').onclick=()=>{k++;show()};$('#areset').onclick=()=>{k=0;show()};show()}

/* beyond text */
const ALN=['MKTLLVAG','MKSLLVAG','MRTLLIAG','MKTLIVAG','MKTLLVSG'],COL=4;
const bars2=items=>`<div class="bars">${items.map(([l,v],i)=>`<div class="bar${i?' th':''}"><span>${l}</span><span class="tr"><span class="fill" style="width:${v*100}%"></span></span><b>${Math.round(v*100)}%</b></div>`).join('')}</div>`;
V.beyond=()=>page('beyond','Beyond text','Tokens do not have to be words. The same kind of model is trained on protein sequences, DNA, images and nanopore signal.',
 `<p class="task">Click each related sequence to count the residue at the unknown position.</p>
 <p class="aln">MKTL<span class="q">?</span>VAG</p>
 <ol class="sents" id="bseqs">${ALN.map((q,i)=>`<li><button data-i="${i}" class="aln">${q.slice(0,COL)}<span class="col">${q[COL]}</span>${q.slice(COL+1)}</button></li>`).join('')}</ol>
 <div id="bbars">${bars2([['L (leucine)',0],['I (isoleucine)',0]])}</div><p class="count" id="bcount">0 of 5 sequences counted.</p>
 <p class="simple">Simplified: counting one column of five invented sequences. Protein models such as ESM-2 use attention over the whole sequence. Other models change the output: AlphaFold2 predicts a 3D structure, a basecaller predicts bases from signal.</p>`,
 'The counting is the same; the tokens are amino acids. The prediction tells you what is common in the training sequences, not what is in your sample.');
function initBeyond(){const seen=new Set();document.querySelectorAll('#bseqs button').forEach(b=>b.onclick=()=>{seen.add(+b.dataset.i);b.classList.add('done');const l=[...seen].filter(i=>ALN[i][COL]==='L').length,n=seen.size;$('#bbars').innerHTML=bars2([['L (leucine)',l/5],['I (isoleucine)',(n-l)/5]]);$('#bcount').textContent=`${n} of 5 sequences counted: L ${l}, I ${n-l}.`;if(n===5)done('beyond','The counts say leucine, 4 of 5. This fragment was sequenced and has isoleucine: the common answer was wrong here, like Friday.')})}

/* permissions */
const REQS=[['read','Read assistant_trials.csv','task,correct_replies,trials'],['run','Run count_correct.py','Find the deadline: 3 of 4. Quote the rule: 1 of 4.'],['del','Delete the folder raw_data/','Folder deleted.']];
V.permissions=()=>page('permissions','Permissions','The program around the model decides which tool requests are carried out. These rules are called permissions.',
 `<p class="task">The agent makes three requests. Set the rules so that it can do the analysis but cannot delete data.</p>
 <table><thead><tr><th>The model asks to</th><th>Rule</th><th>What happens</th></tr></thead><tbody id="prows"></tbody></table>
 <p class="result" id="pres"></p>`,
 'Permissions are set in the program, not in the model. A blocked request returns only “permission denied” to the model.');
function initPermissions(){const P={read:1,run:1,del:1};let changed=false;
 const show=()=>{$('#prows').innerHTML=REQS.map(([k,t,r])=>`<tr><td>${t}</td><td><div class="seg" style="margin:0"><button data-k="${k}" data-v="1" aria-pressed="${P[k]===1}">Allow</button><button data-k="${k}" data-v="0" aria-pressed="${P[k]===0}">Deny</button></div></td><td class="${P[k]?'':'fail'}">${P[k]?`Carried out. The model receives: <code>${r}</code>`:'Blocked. The model receives: <code>permission denied</code>'}</td></tr>`).join('');
  const ok=P.read&&P.run&&!P.del;$('#pres').textContent=P.del?'With these rules the agent can delete raw_data/.':ok?'The analysis runs and the data cannot be deleted.':'The data are safe, but the agent cannot finish the analysis.';
  document.querySelectorAll('#prows button').forEach(b=>b.onclick=()=>{P[b.dataset.k]=+b.dataset.v;changed=true;show()});
  if(changed&&ok)done('permissions','Deny on delete stopped the request in the program. The model could still ask.')};show()}

/* checking the code */
V.code=()=>page('code','Checking the code','An agent wrote a script to average three scores. One score is blank because it was not measured.',
 `<p class="task">Run the script, then work out the answer by hand.</p>
 <pre class="code" id="cinput">scores.csv
score
2
4
          ← blank: not measured</pre>
 <pre class="code" id="csrc">import pandas as pd
df = pd.read_csv("scores.csv")
<span id="cbad">df["score"] = df["score"].fillna(0)</span>
print(df["score"].mean())</pre>
 <div class="nav"><button class="btn" id="crun">Run the script</button></div>
 <p class="reply" id="cout" aria-live="polite"></p>
 <div id="chand" hidden><p class="task">What is the mean of the two measured scores?</p><div class="seg" id="copts"><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button></div><p class="count" id="cexp"></p></div>`,
 'The script ran without an error and printed a wrong mean. A three-value input with a known answer was enough to find it.');
function initCode(){$('#crun').onclick=()=>{$('#cout').textContent='Output: 2.0';$('#chand').hidden=false};
 document.querySelectorAll('#copts button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#copts button').forEach(x=>x.setAttribute('aria-pressed',x===b));const v=+b.dataset.v;
  if(v===3){$('#cexp').textContent='(2 + 4) ÷ 2 = 3. The script printed 2.0: the highlighted line replaced the blank with 0, so it computed (2 + 4 + 0) ÷ 3.';$('#cbad').className='bad';done('code','By hand the mean is 3; the script printed 2.0.')}
  else $('#cexp').textContent=v===2?'That is what the script printed. Add the two measured scores and divide by two.':'Add the two measured scores and divide by two.'})}

V.evaluation=()=>page('evaluation','Evaluation','Classmates asked the assistant two questions, four times each. Choose how many correct replies a task needs, then try another threshold.',
 `<p class="task">Correct replies a task needs to pass:</p>
 <div class="seg" id="eseg">${[1,2,3,4].map(n=>`<button aria-pressed="false" data-n="${n}">${n} of 4</button>`).join('')}</div>
 <table><thead><tr><th>Task</th><th>Correct replies</th><th>Result</th></tr></thead><tbody id="ebody"></tbody></table>
 <p class="result" id="eres"></p>`,
 'The same results pass or fail depending on the threshold. Choose it before you look.');
function initEvaluation(){const T=[['Find the deadline',3],['Quote the rule',1]];const show=n=>{document.querySelectorAll('#eseg button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.n===n));$('#ebody').innerHTML=T.map(([t,c])=>`<tr><td>${t}</td><td>${c} of 4</td><td class="${n?(c>=n?'pass':'fail'):''}">${n?(c>=n?'Pass':'Fail'):'–'}</td></tr>`).join('');if(!n){$('#eres').textContent='Choose a threshold.';return}const p=T.filter(x=>x[1]>=n).length;$('#eres').textContent=`${p} of 2 tasks pass.`;tried.add(n);if(tried.size>=2)done('evaluation','Threshold 1: both pass. 2 or 3: one passes. 4: none.')};const tried=new Set();document.querySelectorAll('#eseg button').forEach(b=>b.onclick=()=>show(+b.dataset.n));show(0)}

V.discussion=()=>`<h1>Before the discussion</h1>
<h2 style="font-size:24px;margin:0 0 6px">Check your understanding</h2>
<ol class="check" id="check">${CHECK.map((c,i)=>`<li><p>${i+1}. ${c.q}</p><div class="opts">${c.opts.map((o,j)=>`<button data-q="${i}" data-j="${j}" aria-pressed="false">${o}</button>`).join('')}</div><p class="ans" id="ans${i}"></p></li>`).join('')}</ol>
<h2 style="font-size:24px;margin:0 0 6px">Questions for the discussion</h2><p class="note" style="margin:0 0 8px">If you would rather not say yours out loud, the Mentimeter question stays open until the end of the day.</p>
<ol class="qs"><li>Which step changed how you think about these tools, if any?</li><li>Where would you trust a language model in your own research, and where would you not?</li><li>What would you want from Globe: training, rules, tools, or none of these?</li></ol>
<div class="take"><div class="nav"><a class="btn ghost" href="#evaluation">Back</a><a class="btn quiet" href="#training">If you have time: Training</a></div></div>`;

const CHECK=[
 {q:'A chatbot gives you a reference that looks right. What do you know?',opts:['It exists','It is likely-looking text; check it','It came from a database'],ans:1,why:'The model produces likely text. A reference can look right and not exist; look it up.'},
 {q:'You ask the same question twice and get different answers. Why?',opts:['The model was updated in between','The reply is drawn from probabilities','Someone edited the answer'],ans:1,why:'Each reply is a new random draw from the same probabilities.'},
 {q:'An assistant has your paper in its window and summarises it. The summary is…',opts:['Correct, because the paper was there','More likely correct, still to check','Copied word for word'],ans:1,why:'The paper in the window makes a good summary more likely, not certain. Check the claims you will use.'},
];
function initCheck(){document.querySelectorAll('#check button').forEach(b=>b.onclick=()=>{const q=+b.dataset.q,j=+b.dataset.j,c=CHECK[q];b.parentElement.querySelectorAll('button').forEach(x=>{x.setAttribute('aria-pressed',x===b);x.disabled=true});const a=$('#ans'+q);a.className='ans show';a.innerHTML=(j===c.ans?'<b>Right.</b> ':`<b>The answer is “${c.opts[c.ans]}”.</b> `)+c.why})}
const INIT={discussion:initCheck,beyond:initBeyond,permissions:initPermissions,code:initCode,attention:initAttention,tokens:initTokens,prediction:initPrediction,sampling:initSampling,training:initTraining,retrieval:initRetrieval,agents:initAgents,evaluation:initEvaluation};
const ALIAS={attn:'attention',bigrams:'prediction',train:'training',rag:'retrieval',cars:'evaluation',resources:'discussion'};
function render(){let id=location.hash.slice(1)||'home';id=ALIAS[id]||id;if(!V[id])id='home';nav(id);$('#view').innerHTML=V[id]();initPredict(id);INIT[id]?.();window.scrollTo(0,0);const h=$('#view h1');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}document.title=(id==='home'?'':NAME[id]+' – ')+'Language Model Lab'}
addEventListener('hashchange',render);render();
</script>
